<!doctype html><html lang=vi><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Chương 2: Lớp, constructor, property và static – Ôn thi OOP</title><style>:root{--ac:#1f9d8a}*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#1d2440;font:16px/1.65 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}

nav.t{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#f4f6fb;padding:10px 0;z-index:5}

.card h3{margin:0 0 6px;font-size:19px}.card ul{margin:6px 0;padding-left:20px}
code{background:#fff0a6;padding:1px 6px;border-radius:5px;font:14px Consolas,"Cascadia Code",monospace}
pre{background:#1b2037;color:#e6e9f8;border-radius:12px;padding:14px 16px;overflow:auto;font:14px/1.55 Consolas,"Cascadia Code",monospace;margin:8px 0}

.trap{background:#fff4f5;border:1px solid #f3c3ca;border-left:6px solid #d6455d;border-radius:12px;padding:12px 18px;margin:18px 0}

.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:2px solid #dfe4f1;background:#fff;border-radius:10px;font:inherit;color:#1d2440;cursor:pointer}
.o.ok{border-color:#1f9d6b;background:#e7f7ef}.o.no{border-color:#d6455d;background:#fdecef}.ex{margin:8px 0 0;color:#5b6486}
#res{position:sticky;bottom:10px;background:#1d2440;color:#fff;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pn{display:flex;justify-content:space-between;margin-top:30px}
.ch{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #dfe4f1;border-left:8px solid var(--ac);border-radius:12px;padding:14px 18px;margin:14px 0}
.ch:hover{background:#fbfcff}.ch h2{margin:0 0 4px;font-size:21px;color:var(--ac)}.ch p{margin:2px 0;color:#5b6486}.ch b{color:#1d2440}</style></head><body><div class=wrap><a href=index.html>← Trang chủ</a><h1>Chương 2: Lớp, constructor, property và static</h1><p class=sub>Đóng gói dữ liệu, các loại constructor, this, get/set, thành viên static, nạp chồng và generic.</p>

<p class=pn><span><a href=chuong1.html>← Chương 0–1</a></span><span><a href=chuong3.html>Chương 3 →</a></span></p></div><script>const D={"n": 2, "theory": [["Thành viên và phạm vi truy cập", "<ul><li>Thành viên không ghi modifier mặc định là <code>private</code>; <code>public</code> mới truy cập được từ ngoài lớp</li><li>Đóng gói: dữ liệu để private, thao tác qua phương thức hoặc property public</li></ul>"], ["Constructor và destructor", "<ul><li>Constructor trùng tên lớp, không có kiểu trả về, có thể nạp chồng: mặc định, nhiều tham số, sao chép (nhận đối tượng cùng lớp)</li><li>Đã viết constructor có tham số thì C# không tự tạo constructor mặc định nữa</li><li>Destructor <code>~Nguoi()</code>: không tham số, do bộ gom rác gọi, không gọi trực tiếp</li></ul>"], ["Con trỏ this", "<ul><li>Tham chiếu tới đối tượng hiện tại; phân biệt field và tham số cùng tên: <code>this.old = old</code></li><li><code>d1.KhoangCach2D(d2)</code> dùng <code>this.x - d.x</code>: this là d1, d là d2</li></ul>"], ["Property get/set", "<ul><li>Truy cập field private an toàn; <code>set</code> dùng <code>value</code> để kiểm tra hợp lệ (bán kính phải &gt; 0)</li><li>Chỉ có <code>get</code> là thuộc tính chỉ đọc, giá trị thường tính từ field khác (KQ đậu/rớt từ điểm Toán, Văn)</li></ul>"], ["static", "<ul><li>Thuộc về lớp, gọi bằng <code>TênLớp.ThànhViên</code>; biến static dùng chung mọi đối tượng (đếm số đối tượng)</li><li>Phương thức static không dùng được this và thành viên không static</li><li>Static constructor: không modifier, không tham số, chạy 1 lần trước lần dùng đầu. <code>static class</code> chỉ chứa thành viên static, không new được</li></ul>"], ["Nạp chồng và Generic", "<ul><li>Nạp chồng: cùng tên, khác danh sách tham số (số lượng hoặc kiểu), kiểu trả về không tính</li><li>Generic: <code>class Demo&lt;T&gt;</code>, <code>Swap&lt;T&gt;(ref T a, ref T b)</code>, <code>IBaseRepository&lt;T&gt;</code>: viết một lần, dùng cho nhiều kiểu</li><li>Generic method suy ra T từ đối số: <code>Compare(2, 2)</code> thì T là int; có thể ghi rõ <code>Compare&lt;int&gt;(2, 2)</code></li></ul>"], ["Property rút gọn và khởi tạo nhanh", "<ul><li>Auto-property: <code>public string Name { get; set; }</code> (C# tự tạo field ẩn)</li><li>Khởi tạo không cần constructor: <code>new Book { Name = \"Book1\", Page = 100 }</code></li><li>Khi cần kiểm tra dữ liệu thì viết property đầy đủ với field private</li></ul>"], ["static trong bài tập quản lý", "<ul><li>Giá trị dùng chung cho mọi đối tượng thì khai báo static: <code>private static double MLTT = 2000;</code> (nhân viên), <code>GIA_DIEN = 3000</code> (hộ gia đình)</li><li>Các field khác để private, truy cập qua property; có constructor mặc định (gán rỗng hoặc 0) và constructor đủ tham số</li><li>Phương thức tính toán đặt trong lớp, như <code>TinhLuongCoBan()</code> của NhanVien</li></ul>"]], "traps": ["Viết constructor có tham số mà không viết constructor rỗng thì <code>new Nguoi()</code> báo lỗi.", "<code>old = old;</code> (không có this) chỉ gán tham số cho chính nó, field giữ giá trị mặc định.", "Static constructor không có <code>public</code> và không có tham số.", "Phương thức static không gọi trực tiếp được thành viên của đối tượng.", "Thành viên static phải gọi qua tên lớp (<code>Traicay.Count</code>); gọi qua đối tượng <code>t.Count</code> là lỗi biên dịch.", "Generic: <code>Compare(2, \"a\")</code> hai đối số khác kiểu thì không suy ra được T."], "code": [["Constructor nạp chồng và this", "public class Nguoi {\n    int tuoi; string ten; double cao;\n    public Nguoi() { tuoi = 20; ten = \"Nguyen Van C\"; cao = 18; }\n    public Nguoi(int tuoi, string ten, double cao) {\n        this.tuoi = tuoi; this.ten = ten; this.cao = cao;\n    }\n    public Nguoi(int tuoi, string ten) { this.tuoi = tuoi; this.ten = ten; }\n    public Nguoi(Nguoi c) { /* constructor sao chép */ }\n    ~Nguoi() { Console.WriteLine(\"Goi ham huy\"); }\n}", "Bốn constructor khác nhau về danh sách tham số; <code>new Nguoi(18, \"B\")</code> chọn bản hai tham số."], ["Property có kiểm tra dữ liệu", "class HinhTron {\n    private double bankinh;\n    public double R {\n        get { return bankinh; }\n        set {\n            if (value > 0) bankinh = value;\n            else Console.WriteLine(\"Du lieu sai\");\n        }\n    }\n}\n// ht.R = 5;   hợp lệ\n// ht.R = -3;  in \"Du lieu sai\", bankinh giữ nguyên", "Set là cửa kiểm soát: dữ liệu sai không vào được field."], ["static: biến đếm, static constructor, static class", "public class Traicay {\n    public static int Count = 0;          // dùng chung mọi đối tượng\n    public Traicay() { Count++; }\n}\npublic static class Toan {\n    public static float PI;\n    static Toan() { PI = 3.14f; }         // chạy 1 lần\n    public static int Lapphuong(int n) { return n * n * n; }\n}\n// Traicay.Count, Toan.Lapphuong(3): gọi qua tên lớp", "Hai đối tượng Traicay làm Count = 2 vì chỉ có một biến Count cho cả lớp."], ["Generic", "static void Swap<T>(ref T a, ref T b) { T temp = a; a = b; b = temp; }\nSwap<int>(ref x, ref y);\nSwap<double>(ref c, ref d);", "Một hàm hoán vị dùng cho int, double, float..."], ["this: khoảng cách hai điểm", "class Diem2D {\n    public int x, y;\n    public double KhoangCach2D(Diem2D d) {          // this là điểm gọi hàm\n        return Math.Sqrt(Math.Pow(this.x - d.x, 2) + Math.Pow(this.y - d.y, 2));\n    }\n}\ndouble kc = d1.KhoangCach2D(d2);                   // this = d1, d = d2", "Bản không dùng this (bài KCDiem2D) phải truyền cả hai điểm: <code>d3.KhoangCach2D(d1, d2)</code>."], ["Generic class và Generic interface", "class Demo<T> {\n    T value;\n    public Demo(T t) { value = t; }\n    public void Xuat() { Console.WriteLine(\"Gia tri: {0}\", value); }\n}\nDemo<int> test1 = new Demo<int>(10);\nDemo<string> test2 = new Demo<string>(\"Cat\");\n\ninterface IBaseRepository<T> { List<T> getAll(); T Save(T item); }\nclass BaseRepository<T> : IBaseRepository<T> {\n    public List<T> getAll() { return new List<T>(); }\n    public T Save(T item) { return item; }\n}\nBaseRepository<Book> bookRepo = new BaseRepository<Book>();\nBook book = bookRepo.Save(new Book { Name = \"Book1\", Page = 100 });", "Một lớp BaseRepository dùng được cho Book, Author... chỉ bằng cách thay kiểu trong dấu &lt; &gt;."], ["Generic method so sánh", "static int Compare<T>(T first, T second) {\n    if (first.Equals(second)) return 0;       // bằng nhau\n    return 1;                                  // khác nhau\n}\nint r1 = Compare(2, 2);            // T suy ra là int, kết quả 0\nint r2 = Compare(\"abc\", \"def\");    // T là string, kết quả 1", "Cùng một hàm so sánh số và chuỗi."], ["Bài tập quản lý nhân viên (rút gọn)", "public class NhanVien {\n    private static double MLTT = 2000;               // dùng chung mọi nhân viên\n    private string maNV, hoTen;\n    private double heSoLuong;\n    public string HoTen { get { return hoTen; } set { hoTen = value; } }\n    public NhanVien() { maNV = \"\"; hoTen = \"\"; heSoLuong = 0; }\n    public NhanVien(string maNV, string hoTen, double heSoLuong) {\n        this.maNV = maNV; this.hoTen = hoTen; this.heSoLuong = heSoLuong;\n    }\n}", "Bản rút gọn từ bài NhanVien: static cho giá trị chung, field private, property, hai constructor."], ["Property chỉ có get", "class HocSinh {\n    public double Toan { get; set; }\n    public double Van  { get; set; }\n    public string KQ { get { return (Toan >= 5 && Van >= 5) ? \"Dau\" : \"Rot\"; } }\n}\n// hs.KQ = \"Dau\";   lỗi: KQ không có set", "KQ luôn được tính từ Toán và Văn; điều kiện đậu ở đây chỉ là ví dụ minh họa."]], "cards": [["Thành viên không ghi modifier thì sao?", "Mặc định là private."], ["Constructor khác phương thức thường?", "Trùng tên lớp, không kiểu trả về, tự chạy khi new."], ["Khi nào dùng this?", "Phân biệt field và tham số cùng tên, hoặc tham chiếu đối tượng hiện tại."], ["Property chỉ có get nghĩa là gì?", "Chỉ đọc từ bên ngoài; giá trị thường tính từ các field khác."], ["Biến static khác biến thường?", "Chỉ có 1 bản cho cả lớp, dùng chung; truy cập bằng TênLớp.Biến."], ["Destructor do ai gọi?", "Bộ gom rác (GC); không gọi trực tiếp, không có tham số."], ["Generic dùng để làm gì?", "Viết một lần cho nhiều kiểu dữ liệu, kiểm tra kiểu lúc biên dịch."], ["Auto-property là gì?", "{ get; set; } không viết thân: C# tự tạo field ẩn."], ["Gọi thành viên static qua đâu?", "Qua tên lớp (Traicay.Count), không gọi qua đối tượng."], ["Generic method suy ra T thế nào?", "Từ kiểu của đối số: Compare(2, 2) thì T là int."], ["Constructor sao chép nhận gì?", "Một đối tượng cùng lớp để tạo bản sao các giá trị."], ["Khi nào dùng static class?", "Khi chỉ chứa hàm tiện ích và hằng dùng chung, như lớp Toan."], ["Nạp chồng khác ghi đè?", "Nạp chồng: cùng lớp, cùng tên, khác tham số. Ghi đè (override) thuộc kế thừa, Chương 3."]], "quiz": [["Thành viên của lớp không ghi access modifier thì mặc định là?", null, ["public", "private", "protected", "internal"], 1, "Mặc định private: ngoài lớp không truy cập được."], ["Điều nào đúng về constructor?", null, ["Có kiểu trả về void", "Trùng tên lớp và không có kiểu trả về", "Bắt buộc phải static", "Mỗi lớp chỉ có một constructor"], 1, "Constructor trùng tên lớp, không kiểu trả về và có thể nạp chồng."], ["Constructor chỉ viết <code>old = old;</code> (không có this) thì field <code>old</code> ra sao?", null, ["Nhận giá trị tham số", "Giữ giá trị mặc định (0)", "Lỗi biên dịch", "Bằng null"], 1, "Tham số che field nên chỉ gán tham số cho chính nó. Cần viết this.old = old."], ["Property R có set: <code>if (value &gt; 0) bankinh = value; else báo lỗi</code>. Gán <code>ht.R = -5</code> thì?", null, ["bankinh = -5", "Báo lỗi, bankinh giữ nguyên", "Lỗi biên dịch", "bankinh = 5"], 1, "Set kiểm tra điều kiện nên giá trị sai bị từ chối."], ["Giá trị <code>Traicay.Count</code> sau khi tạo 2 đối tượng?", "public class Traicay {\n    public static int Count = 0;\n    public Traicay() { Count++; }\n}\nnew Traicay(); new Traicay();", ["0", "1", "2", "20"], 2, "Count là static nên dùng chung; hai lần new tăng hai lần."], ["Static constructor chạy khi nào?", null, ["Mỗi lần new", "Một lần, trước lần sử dụng đầu tiên", "Khi đối tượng bị hủy", "Phải gọi thủ công"], 1, "Tự chạy đúng 1 lần, không có access modifier và không có tham số."], ["Nạp chồng phương thức phân biệt dựa vào?", null, ["Kiểu trả về", "Danh sách tham số (số lượng hoặc kiểu)", "Tên biến tham số", "Access modifier"], 1, "Ví dụ Cal.max(int,int) và Cal.max(float,float)."], ["<code>public string Name { get; set; }</code> là gì?", null, ["Field public", "Property tự cài đặt (auto-property)", "Phương thức", "Hằng số"], 1, "C# tự tạo field ẩn cùng get và set."], ["Dòng nào gây lỗi biên dịch?", "class Traicay { public static int Count = 0; }\nTraicay t = new Traicay();\nConsole.WriteLine(t.Count);", ["Dòng 1", "Dòng 3: gọi static qua đối tượng", "Dòng 2", "Không dòng nào"], 1, "Thành viên static gọi qua tên lớp: Traicay.Count."], ["Với <code>static int Compare&lt;T&gt;(T a, T b)</code>, lệnh <code>Compare(2, 2)</code> thì T là kiểu nào?", null, ["object", "int", "string", "Bắt buộc ghi rõ kiểu"], 1, "Trình biên dịch suy ra T từ đối số; 2 là int. Có thể viết rõ Compare<int>(2, 2)."], ["Kết quả in ra?", "class Demo<T> {\n    T value;\n    public Demo(T t) { value = t; }\n    public void Xuat() { Console.WriteLine(\"Gia tri: {0}\", value); }\n}\nnew Demo<string>(\"Cat\").Xuat();", ["Gia tri: Cat", "Gia tri: T", "Lỗi biên dịch", "Gia tri: 0"], 0, "T được thay bằng string nên value là Cat."], ["Lớp chỉ có <code>Nguoi(int tuoi, string ten)</code>. Lệnh <code>new Nguoi()</code> thì?", null, ["Chạy bình thường", "Lỗi: không còn constructor mặc định", "tuoi = 0, ten = null", "Chỉ cảnh báo"], 1, "Đã viết constructor có tham số thì C# không tự tạo constructor rỗng."], ["Trong phương thức static có dùng được <code>this</code> không?", null, ["Được", "Không, vì static thuộc về lớp chứ không thuộc đối tượng", "Chỉ khi có constructor", "Chỉ với biến static"], 1, "Phương thức static không gắn với đối tượng cụ thể nên không có this."], ["Property chỉ có <code>get</code> (không có set) dùng để?", null, ["Cho phép sửa từ ngoài", "Chỉ cho đọc, thường tính từ field khác", "Tạo hằng số", "Tạo constructor"], 1, "Ví dụ KQ đậu/rớt tính từ điểm Toán, Văn và không cho gán trực tiếp."], ["<code>d1.KhoangCach2D(d2)</code> có <code>this.x - d.x</code> trong thân hàm. <code>this</code> ứng với?", null, ["d2", "d1", "Cả hai", "Lớp Diem2D"], 1, "this là đối tượng gọi phương thức (d1); d là tham số (d2)."], ["Đoạn code in ra giá trị nào?", "class A {\n    public static int n;\n    static A() { n = 5; }\n    public A() { n++; }\n}\nnew A(); new A();\nConsole.WriteLine(A.n);", ["5", "6", "7", "0"], 2, "Static constructor chạy 1 lần đặt n = 5; mỗi lần new tăng 1 nên n = 7."]]};const $=s=>document.querySelector(s);
const KW='abstract|override|virtual|sealed|class|interface|public|private|protected|static|new|void|int|string|double|float|decimal|bool|char|return|if|else|for|foreach|while|do|in|this|base|get|set|value|enum|ref|try|catch|throw|namespace|using';
const RX=new RegExp(String.raw`(//.*)|("(?:[^"\\\n]|\\.)*")|\b(${KW})\b|\b(\d+(?:\.\d+)?)\b`,'g');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(RX,(m,c,t,k,n)=>c?`<i class=c>${c}</i>`:t?`<i class=s>${t}</i>`:k?`<i class=k>${k}</i>`:`<i class=n>${n}</i>`);
$('#t0').innerHTML=D.theory.map(([h,b])=>`<div class=card><h3>${h}</h3>${b}</div>`).join('')+`<div class=trap><b>Bẫy thường gặp khi thi</b><ul>${D.traps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
$('#t1').innerHTML=D.code.map(([h,c,n])=>`<div class=card><h3>${h}</h3><pre><code>${hl(c.trim())}</code></pre><p>${n}</p></div>`).join('');
$('#t2').innerHTML='<p class=sub>Bấm vào thẻ để xem đáp án, bấm lần nữa để quay lại câu hỏi.</p><div class=fcs>'+D.cards.map(([q],i)=>`<button class=fc data-i=${i}>${esc(q)}</button>`).join('')+'</div>';
$('#t2').onclick=e=>{const b=e.target.closest('.fc');if(!b)return;const [q,a]=D.cards[b.dataset.i];const on=b.classList.toggle('on');b.textContent=on?a:q};
let order,score,done;
function quiz(){order=D.quiz.map((_,i)=>i).sort(()=>Math.random()-.5);score=done=0;
$('#t3').innerHTML=order.map((qi,n)=>{const [q,code,os]=D.quiz[qi];return `<div class=q data-n=${n}><p><b>Câu ${n+1}.</b> ${q}</p>${code?`<pre><code>${hl(code)}</code></pre>`:''}${os.map((o,j)=>`<button class=o data-j=${j}>${o}</button>`).join('')}<p class=ex hidden></p></div>`}).join('')+'<div id=res><span id=sc>Chọn đáp án để bắt đầu</span><button class=o id=rs style="width:auto;margin:0;color:#1d2440">Làm lại</button></div>'}
$('#t3').onclick=e=>{const b=e.target.closest('.o');if(!b)return;if(b.id=='rs')return quiz();const q=b.closest('.q');if(!q||q.dataset.d)return;q.dataset.d=1;const [,,,ok,ex]=D.quiz[order[q.dataset.n]],j=+b.dataset.j;
q.querySelectorAll('.o')[ok].classList.add('ok');if(j==ok)score++;else b.classList.add('no');const p=q.querySelector('.ex');p.hidden=false;p.textContent=ex;done++;
$('#sc').textContent=`Đúng ${score}/${done} (tổng ${D.quiz.length} câu)`;
if(done==D.quiz.length){try{const k='oop'+D.n;if(score>(+localStorage.getItem(k)||0))localStorage.setItem(k,score)}catch(_){}$('#sc').textContent=`Hoàn thành: ${score}/${D.quiz.length} câu đúng`}};
quiz();
document.querySelectorAll('nav.t button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav.t button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on');scrollTo(0,0)});</script></body></html>
