.ch{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-left:8px solid var(--ac);border-radius:12px;padding:14px 18px;margin:14px 0}
.ch:hover{background:var(--hov)}.ch h2{margin:0 0 4px;font-size:21px;color:var(--lk)}.ch p{margin:2px 0;color:var(--mut)}.ch b{color:var(--fg)}</style></head><body><div class=wrap><div class=top><a href=index.html>← Trang chủ</a><button id=thm class=thm type=button aria-pressed=false></button></div><h1>Chương 4: Nguyên lý SOLID và Design Pattern</h1><p class=sub>5 nguyên lý thiết kế hướng đối tượng và 3 pattern cơ bản: Singleton, Composite, Strategy.</p>

<p class=pn><span><a href=chuong3.html>← Chương 3</a></span><span></span></p></div><script>const D={"n": 4, "theory": [["S – Đơn nhiệm (SRP)", "<ul><li>Một class chỉ có một lý do để thay đổi</li><li>Person không tự kiểm tra email: tách lớp Email. Student tách riêng Formatter và ExportLog</li></ul>"], ["O – Đóng/mở (OCP)", "<ul><li>Mở để mở rộng, đóng để sửa đổi. Nhớ: MỞ → THÊM, ĐÓNG → HẠN CHẾ SỬA</li><li>Shape trừu tượng, mỗi hình tự tính diện tích: thêm hình chỉ thêm class, AreaDisplay không sửa</li><li>Dấu hiệu vi phạm: chuỗi <code>if (shape is HV) ... else if (shape is HT)</code></li></ul>"], ["L – Thay thế Liskov (LSP)", "<ul><li>Đối tượng lớp con thay được lớp cha mà chương trình vẫn đúng</li><li>Vi phạm: ForeignStudent ném exception ở runForSecretary; Penguin : Bird mà Fly báo lỗi; Square : Rectangle</li><li>Cách sửa: tách interface hoặc lớp trừu tượng chung (KoViPhamHinhHoc)</li></ul>"], ["I – Chia tách giao diện (ISP)", "<ul><li>Nhiều interface nhỏ thay vì một interface béo. Dog không nên bị ép cài <code>Fly()</code></li><li>ILamViec, IAn, INgu: Robot chỉ cần ILamViec</li></ul>"], ["D – Đảo ngược phụ thuộc (DIP)", "<ul><li>Module cấp cao không phụ thuộc module cấp thấp; cả hai phụ thuộc abstraction</li><li>Notification nhận IMessageSender (Email/SMS) qua constructor; copy từ Reader sang Writer thay vì new Keyboard, Printer cố định</li></ul>"], ["Design pattern", "<ul><li>Giải pháp tổng thể cho vấn đề chung; 3 nhóm: Creational (khởi tạo), Structural (cấu trúc), Behavioral (hành vi)</li><li><b>Singleton</b>: private constructor + private static instance + public static GetInstance(); dùng cho cấu hình, kết nối CSDL, logger</li><li><b>Composite</b>: thành phần và tổng thể xử lý như nhau, cấu trúc cây (thư mục–tập tin, phòng ban–nhân viên)</li><li><b>Strategy</b>: tách thuật toán ra khỏi lớp dùng nó, đổi lúc chạy (thanh toán tiền mặt, thẻ, ví)</li><li>OOP là công cụ; pattern là cách dùng công cụ đó hợp lý</li></ul>"], ["Nhóm Creational và số lượng pattern", "<ul><li>Factory Pattern: tạo đối tượng (ví dụ quản lý nhân viên); Singleton: chỉ tạo một đối tượng duy nhất; Builder: xây dựng đối tượng từng bước</li><li>Theo slide, có khoảng 32 (9 + 11 + 12) design pattern thông dụng</li></ul>"], ["Singleton trong C#", "<ul><li>Cách tạo: constructor private, biến private static giữ instance, phương thức hoặc thuộc tính public static trả về instance</li><li>Bản trong bài giảng dùng <code>Lazy&lt;Logger&gt;</code>: Lazy chỉ tạo giá trị khi gọi <code>.Value</code> lần đầu và mặc định an toàn đa luồng</li><li>Logger implement <code>ILogger</code> nên BusinessService chỉ phụ thuộc interface: Singleton kết hợp DIP</li><li>Dùng cho: cấu hình hệ thống, kết nối CSDL, ghi log, bộ quản lý máy in (Printer Spooler)</li></ul>"], ["Composite và Strategy qua ví dụ", "<ul><li>Composite (Structural): interface chung <code>ICompanyMember</code>; <code>Employee</code> là lá, <code>Department</code> giữ danh sách thành viên (Add, Remove) và tính tổng lương bằng cách gọi <code>GetSalary()</code> của từng thành viên</li><li>Cùng một lời gọi dùng cho nhân viên lẻ lẫn cả phòng ban nên tạo thành cấu trúc cây; ví dụ khác: mạch điện, thư mục–tập tin</li><li>Strategy (Behavioral): định nghĩa tập thuật toán thay thế nhau, đổi lúc chạy mà không sửa lớp sử dụng</li></ul>"]], "traps": ["OCP nói về thêm mà không sửa; LSP nói về lớp con có làm sai hành vi của cha hay không.", "SRP ở cấp class, ISP ở cấp interface.", "Singleton không chỉ là biến static: nó kiểm soát số thể hiện bằng private constructor.", "Factory, Singleton, Builder đều thuộc nhóm Creational.", "DIP là nguyên lý (phụ thuộc abstraction), không đồng nghĩa với Dependency Injection; truyền qua constructor chỉ là một cách thực hiện.", "Composite chỉ đúng tinh thần khi lá và nút cùng implement một interface để lớp dùng xử lý đồng nhất, không phải kiểm tra loại."], "code": [["OCP: thêm hình mới không sửa AreaDisplay", "public abstract class Shape { public abstract double TinhDienTich(); }\npublic class HinhVuong : Shape {\n    public double Canh;\n    public override double TinhDienTich() { return Canh * Canh; }\n}\npublic class HinhTron : Shape {\n    public double R;\n    public override double TinhDienTich() { return Math.PI * R * R; }\n}\npublic class AreaDisplay {\n    public void Show(List<Shape> ds) { foreach (var s in ds) Console.WriteLine(s.TinhDienTich()); }\n}", "Thêm HinhChuNhat chỉ cần một class mới."], ["DIP: phụ thuộc interface", "public interface IMessageSender { void SendMessage(string message); }\npublic class EmailSender : IMessageSender { public void SendMessage(string m) { Console.WriteLine(\"Gui email: \" + m); } }\npublic class Notification {\n    private readonly IMessageSender _sender;\n    public Notification(IMessageSender sender) { _sender = sender; }   // nhận abstraction\n    public void Send(string m) { _sender.SendMessage(m); }\n}", "Muốn gửi SMS chỉ cần tạo SMSSender : IMessageSender, Notification giữ nguyên."], ["Singleton (minh họa theo 3 bước ở slide)", "public sealed class Logger {\n    private static Logger instance;                 // thể hiện duy nhất\n    private Logger() { }                            // không ai new được\n    public static Logger GetInstance() {\n        if (instance == null) instance = new Logger();\n        return instance;\n    }\n}", "Ví dụ viết lại theo ba bước: constructor private, biến private static, phương thức public static trả về instance. Bản này chưa an toàn đa luồng; xem thêm bản <code>Lazy&lt;T&gt;</code> ở ví dụ Singleton khác."], ["Strategy: đổi cách thanh toán lúc chạy", "public interface IPaymentStrategy { void Pay(decimal amount); }\npublic class ShoppingCart {\n    private IPaymentStrategy strategy;\n    public void SetPaymentStrategy(IPaymentStrategy s) { strategy = s; }\n    public void Checkout(decimal amount) { strategy.Pay(amount); }\n}\ncart.SetPaymentStrategy(new EWalletPayment(\"MoMo\"));\ncart.Checkout(500000);", "CashPayment, CreditCardPayment, EWalletPayment cùng implement IPaymentStrategy."], ["SRP: tách việc kiểm tra email (minh họa)", "public class Email {\n    public string Address { get; private set; }\n    public Email(string address) { Address = address; }\n    public bool IsValid() { return Address.Contains(\"@\") && Address.Contains(\".\"); }   // chỉ lo kiểm tra email\n}\npublic class Person {\n    public string Name { get; set; }\n    public Email Email { get; set; }          // Person chỉ giữ dữ liệu, không tự kiểm tra\n}", "Ví dụ minh họa: nếu quy tắc email đổi thì chỉ sửa lớp Email, Person không bị ảnh hưởng."], ["ISP: tách interface nhỏ (minh họa)", "public interface IAnimal { void Eat(); }\npublic interface IBird : IAnimal { void Fly(); }\npublic class Dog : IAnimal {\n    public void Eat() { Console.WriteLine(\"Cho an\"); }          // không bị ép cài Fly()\n}\npublic class Eagle : IBird {\n    public void Eat() { Console.WriteLine(\"Chim an\"); }\n    public void Fly() { Console.WriteLine(\"Chim bay\"); }\n}", "Tương ứng I_Animal, I_Bird trong bài: Dog chỉ cài đặt đúng thứ nó cần."], ["LSP: tách interface để con không phải ném exception (minh họa)", "public interface IStudent { string Name { get; set; } }\npublic interface ICandidate { void RunForSecretary(); }       // chỉ nhóm được ứng cử\npublic class Student : IStudent, ICandidate {\n    public string Name { get; set; }\n    public void RunForSecretary() { /* được ứng cử */ }\n}\npublic class ForeignStudent : IStudent {\n    public string Name { get; set; }                           // không có RunForSecretary\n}", "Không còn phương thức nào buộc ForeignStudent phải ném exception."], ["Composite: phòng ban và nhân viên (rút gọn)", "public interface ICompanyMember { string Name { get; } decimal GetSalary(); }\npublic class Employee : ICompanyMember {\n    public string Name { get; private set; }\n    public decimal Salary { get; private set; }\n    public Employee(string name, decimal salary) { Name = name; Salary = salary; }\n    public decimal GetSalary() { return Salary; }\n}\npublic class Department : ICompanyMember {\n    public string Name { get; private set; }\n    private List<ICompanyMember> members = new List<ICompanyMember>();\n    public Department(string name) { Name = name; }\n    public void Add(ICompanyMember m) { members.Add(m); }\n    public decimal GetSalary() {\n        decimal total = 0;\n        foreach (var m in members) total += m.GetSalary();      // gọi qua interface chung\n        return total;\n    }\n}", "Department có thể chứa cả Employee lẫn Department khác; lời gọi <code>GetSalary()</code> dùng chung cho mọi thành viên."], ["Singleton với Lazy&lt;T&gt; và DIP (rút gọn từ bài giảng)", "public sealed class Logger : ILogger {\n    private static readonly Lazy<Logger> instance = new Lazy<Logger>(() => new Logger());\n    private Logger() { }\n    public static Logger Instance { get { return instance.Value; } }\n    public void Info(string message) { Console.WriteLine(\"[INFO] \" + message); }\n}\npublic class BusinessService {\n    private readonly ILogger _logger;\n    public BusinessService(ILogger logger) { _logger = logger; }   // phụ thuộc interface\n}\nvar svc = new BusinessService(Logger.Instance);", "Bản rút gọn (bài giảng còn ghi log ra file và có Warning, Error): constructor private, Lazy giữ instance, truy cập qua <code>Logger.Instance</code>."]], "cards": [["SOLID gồm gì?", "SRP, OCP, LSP, ISP, DIP."], ["Nhớ OCP bằng 2 từ?", "MỞ → THÊM, ĐÓNG → HẠN CHẾ SỬA."], ["Dấu hiệu vi phạm OCP?", "Chuỗi if/else theo từng loại; mỗi lần thêm loại phải sửa code cũ."], ["LSP phát biểu thế nào?", "Đối tượng lớp con thay được lớp cha mà chương trình vẫn đúng."], ["DIP nói gì?", "Cấp cao và cấp thấp đều phụ thuộc abstraction (interface/lớp trừu tượng)."], ["3 nhóm design pattern?", "Creational, Structural, Behavioral."], ["Khi nào dùng Strategy?", "Có nhiều thuật toán thay thế nhau và muốn đổi lúc chạy."], ["Composite dùng khi nào?", "Nhóm đối tượng cần xử lý như một đối tượng, cấu trúc cây."], ["SRP nói gì?", "Mỗi class chỉ có một lý do để thay đổi (một trách nhiệm)."], ["ISP nói gì?", "Nhiều interface nhỏ đúng nhu cầu, thay vì một interface lớn bắt class cài thứ không dùng."], ["Dấu hiệu vi phạm LSP?", "Lớp con ném exception hoặc làm sai hành vi lớp cha đã hứa (Penguin.Fly, ForeignStudent)."], ["Lazy<T> trong Singleton để làm gì?", "Tạo instance khi dùng lần đầu và mặc định an toàn đa luồng."], ["Composite gồm những vai trò nào?", "Interface chung, lá (Employee) và nút chứa danh sách thành viên (Department)."], ["Factory, Singleton, Builder khác nhau?", "Factory tạo đối tượng; Singleton chỉ một instance; Builder xây dựng đối tượng từng bước."], ["DIP có phải Dependency Injection không?", "Không: DIP là nguyên lý; truyền phụ thuộc qua constructor chỉ là một cách thực hiện."]], "quiz": [["Class Person vừa lưu thông tin vừa kiểm tra email hợp lệ. Sửa theo nguyên lý nào?", null, ["SRP: tách lớp Email kiểm tra email", "OCP", "DIP", "LSP"], 0, "Mỗi class một trách nhiệm: tách phần xác thực email sang lớp Email."], ["Thêm hình mới mà không phải sửa AreaDisplay nhờ lớp trừu tượng Shape là áp dụng?", null, ["SRP", "OCP", "ISP", "LSP"], 1, "Mở để mở rộng (thêm class), đóng để sửa đổi (không sửa AreaDisplay)."], ["ForeignStudent kế thừa Student nhưng runForSecretary() ném exception. Vi phạm nguyên lý?", null, ["LSP", "SRP", "DIP", "Không vi phạm"], 0, "Lớp con không thay thế được cha mà vẫn đúng. Sửa bằng cách tách interface."], ["Dog bị ép cài <code>Fly()</code> và ném exception. Vi phạm và cách sửa?", null, ["ISP: tách I_Animal thành interface nhỏ", "SRP: thêm class", "OCP: sửa Dog", "DIP: new trực tiếp"], 0, "Interface quá lớn ép class cài thứ không cần; tách thành I_Animal, I_Bird, I_Fish."], ["<code>Notification</code> nhận <code>IMessageSender</code> qua constructor (Email hoặc SMS). Đây là?", null, ["DIP", "SRP", "Singleton", "Composite"], 0, "Lớp cấp cao phụ thuộc abstraction thay vì EmailSender hay SMSSender cụ thể."], ["Điều nào KHÔNG thuộc cách tạo Singleton?", null, ["Private constructor", "Biến private static giữ thể hiện duy nhất", "Public static GetInstance()", "Constructor public để ai cũng new được"], 3, "Constructor phải private để chặn tạo thêm đối tượng."], ["Composite (thư mục chứa tập tin và thư mục con) thuộc nhóm pattern nào?", null, ["Creational", "Structural", "Behavioral", "Không nhóm nào"], 1, "Composite là Structural; Singleton là Creational; Strategy là Behavioral."], ["<code>cart.SetPaymentStrategy(new EWalletPayment(...))</code> minh họa pattern nào?", null, ["Strategy", "Singleton", "Composite", "Factory"], 0, "Strategy cho phép đổi thuật toán (cách thanh toán) lúc chạy mà không sửa ShoppingCart."], ["Nguyên lý nào phát biểu: một class chỉ nên có một lý do để thay đổi?", null, ["SRP", "OCP", "LSP", "DIP"], 0, "Đó là Single Responsibility Principle."], ["Đoạn code vi phạm nguyên lý nào?", "public double TinhDienTich(object s) {\n    if (s is HinhVuong v) return v.Canh * v.Canh;\n    else if (s is HinhTron t) return Math.PI * t.R * t.R;\n    return 0;\n}", ["OCP: thêm hình mới phải sửa hàm", "SRP", "DIP", "Không vi phạm"], 0, "Mỗi hình mới lại phải sửa chuỗi if; nên để mỗi hình tự tính diện tích qua lớp trừu tượng Shape."], ["Penguin kế thừa Bird và <code>Fly()</code> chỉ in lỗi. Đây là dấu hiệu vi phạm?", null, ["LSP", "SRP", "ISP", "Singleton"], 0, "Penguin không thay thế được Bird mà chương trình vẫn đúng."], ["Interface <code>IWorker</code> gồm Work(), Eat(), Sleep(). Robot chỉ cần Work(). Cách sửa theo ISP?", null, ["Tách thành ILamViec, IAn, INgu", "Cho Robot ném exception ở Eat()", "Gộp thêm phương thức vào IWorker", "Đổi IWorker thành lớp abstract"], 0, "Tách interface nhỏ để lớp chỉ cài đặt cái nó cần."], ["Trong Singleton, <code>Lazy&lt;Logger&gt;</code> giúp gì?", null, ["Khởi tạo khi dùng lần đầu và an toàn đa luồng", "Cho phép new Logger() từ bên ngoài", "Tạo nhiều instance", "Thay thế constructor private"], 0, "Lazy<T> chỉ tạo giá trị khi gọi .Value lần đầu và mặc định an toàn đa luồng."], ["<c
