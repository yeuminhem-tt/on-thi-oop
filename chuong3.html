.ch:hover{background:var(--hov)}.ch h2{margin:0 0 4px;font-size:21px;color:var(--lk)}.ch p{margin:2px 0;color:var(--mut)}.ch b{color:var(--fg)}</style></head><body><div class=wrap><div class=top><a href=index.html>← Trang chủ</a><button id=thm class=thm type=button aria-pressed=false></button></div><h1>Chương 3: Kế thừa, đa hình, trừu tượng</h1><p class=sub>Lớp cha – lớp con, thứ tự constructor, new/virtual/override, abstract, sealed, interface và lớp lồng nhau.</p>

<p class=pn><span><a href=chuong2.html>← Chương 2</a></span><span><a href=chuong4.html>Chương 4 →</a></span></p></div><script>const D={"n": 3, "theory": [["Kế thừa cơ bản", "<ul><li>Cú pháp <code>class SinhVien : Nguoi</code>; lớp con dùng được thành viên public và protected của lớp cha</li><li><code>protected</code>: lớp con truy cập được, bên ngoài thì không</li><li>C# đơn kế thừa lớp, nhưng implement được nhiều interface</li></ul>"], ["Constructor trong kế thừa", "<ul><li>Tạo lớp con: constructor lớp cha chạy trước, rồi đến lớp con</li><li>Không ghi gì thì tự gọi constructor mặc định của cha; cha chỉ có constructor có tham số thì con bắt buộc <code>: base(...)</code></li></ul>"], ["new, virtual, override", "<ul><li><code>new</code> che phương thức cha: chạy theo kiểu của biến khai báo</li><li><code>virtual</code> (cha) + <code>override</code> (con) là đa hình: chạy theo đối tượng thật</li><li><code>base.Xuat()</code> gọi phiên bản của lớp cha</li></ul>"], ["abstract, sealed, interface", "<ul><li><code>abstract class</code>: không new được; phương thức abstract không có thân, lớp con phải override</li><li><code>sealed class</code>: không cho kế thừa; <code>sealed override</code>: chặn override tiếp</li><li><code>interface</code>: chủ yếu chỉ khai báo (từ C# 8 có thể có cài đặt mặc định), thành viên mặc định public, lớp phải cài đặt đủ, implement nhiều interface được</li></ul>"], ["Lớp lồng nhau", "<ul><li>Lớp inner khai báo trong lớp outer, dùng qua <code>LopHoc.SinhVien</code>; inner truy cập được thành viên private của outer thông qua đối tượng outer</li></ul>"], ["Kế thừa nhiều tầng và kiểu tham chiếu", "<ul><li>Lớp con có thể là cha của lớp khác (A → B → C); mọi lớp cuối cùng đều kế thừa <code>object</code></li><li>Biến kiểu lớp cha trỏ được tới đối tượng lớp con: <code>Xe h = new XeHoi();</code> nhưng chỉ gọi được thành viên khai báo ở lớp cha</li></ul>"], ["Đa hình qua danh sách đối tượng", "<ul><li><code>List&lt;Bird&gt;</code> chứa Eagle, Duck, Penguin; duyệt và gọi <code>Fly()</code>, mỗi đối tượng chạy phiên bản override của chính nó</li><li>Muốn có đa hình phải có <code>virtual</code> ở cha và <code>override</code> ở con; thiếu một trong hai thì chạy theo kiểu của biến</li><li>Penguin override Fly nhưng báo lỗi: gợi ý vi phạm LSP, sẽ gặp lại ở Chương 4</li></ul>"], ["Lớp trừu tượng trong bài tập", "<ul><li>Lớp abstract Phong có constructor gán thuộc tính chung, phương thức abstract <code>TinhTienPhong()</code> và phương thức <code>virtual Xuat()</code></li><li>PhongA, PhongB gọi <code>: base(...)</code> và override TinhTienPhong theo công thức riêng từng loại phòng</li><li>Lớp abstract được phép có constructor, field, property và phương thức đã cài đặt</li></ul>"]], "traps": ["<code>Xe h = new XeHoi(); h.Xuat();</code> với <code>new</code> chạy Xuat của lớp cha; chỉ virtual/override mới chạy bản của lớp con.", "Cha không có constructor mặc định mà con quên <code>base(...)</code> thì lỗi biên dịch.", "Không new được abstract class và interface, nhưng dùng làm kiểu biến trỏ tới đối tượng con thì được.", "<code>Square : Rectangle</code> mà override SetWidth/SetHeight là dấu hiệu vi phạm LSP (Chương 4).", "Lớp abstract không new được nhưng vẫn có constructor; nếu constructor có tham số thì lớp con phải gọi <code>: base(...)</code>.", "Phương thức abstract không có thân (kết thúc bằng <code>;</code>) và chỉ nằm trong lớp abstract; lớp con quên <code>override</code> là lỗi biên dịch."], "code": [["Thứ tự constructor và base(...)", "public class LopCha {\n    protected int _x;\n    public LopCha(int x) { _x = x; Console.WriteLine(\"Ctor lop cha\"); }\n    public void Xuat() { Console.WriteLine(\"_x = {0}\", _x); }\n}\npublic class LopCon : LopCha {\n    int _y;\n    public LopCon(int x, int y) : base(x) {      // cha chạy trước\n        _y = y; Console.WriteLine(\"Ctor lop con\");\n    }\n    public new void Xuat() { base.Xuat(); Console.WriteLine(\"_y = {0}\", _y); }\n}\nLopCha bs = new LopCon(10, 20);\nbs.Xuat();    // new: chỉ in _x vì biến có kiểu LopCha", "In ra: Ctor lop cha, Ctor lop con, rồi _x = 10."], ["Đa hình với virtual / override", "class Tau { public virtual void LayThongtin() { Console.WriteLine(\"Day la chiec tau\"); } }\nclass TauChien : Tau { public override void LayThongtin() { Console.WriteLine(\"Day la tau Chien\"); } }\nTau b = new TauChien();\nb.LayThongtin();     // \"Day la tau Chien\": theo đối tượng thật", "Đổi override thành new thì kết quả là Day la chiec tau."], ["Lớp trừu tượng", "abstract class NhanVien {\n    public string HoTen { get; set; }\n    public abstract double TinhLuong();          // con bắt buộc override\n    public void XuatThongTin() { Console.WriteLine(HoTen + \": \" + TinhLuong()); }\n}\nclass NhanVienThoiVu : NhanVien {\n    public int SoNgayLam; public double LuongMotNgay;\n    public override double TinhLuong() { return SoNgayLam * LuongMotNgay; }\n}", "Lớp cha viết sẵn phần chung (XuatThongTin), phần riêng (TinhLuong) để lớp con quyết định."], ["Interface", "public interface ITaiKhoan {\n    void GuiTien(decimal soLuong);\n    bool RutTien(decimal soLuong);\n    decimal SoTien { get; }\n}\npublic class TaiKhoanTietKiem : ITaiKhoan { /* phải cài đặt đủ 3 thành viên */ }\npublic class Tinhtoans : ITinhtoan, IKetqua { }     // implement nhiều interface", "Interface là bản hợp đồng: lớp implement phải thực hiện đầy đủ."], ["Kế thừa nhiều tầng (minh họa)", "class Nguoi {\n    public string HoTen;\n    protected int namSinh;\n    public void Xuat() { Console.WriteLine(HoTen + \" - \" + namSinh); }\n}\nclass SinhVien : Nguoi {\n    public string MSSV;\n    public void GanNam(int n) { namSinh = n; }     // protected: dùng được trong lớp con\n}\nclass SinhVienCNTT : SinhVien { public string Nganh; }   // kế thừa thêm một tầng\nSinhVien sv = new SinhVien();\nsv.HoTen = \"An\";                                   // thành viên public của cha\n// sv.namSinh = 2005;                              // lỗi: protected, ngoài lớp không dùng được", "Ví dụ minh họa: lớp con dùng được public và protected của cha, bên ngoài chỉ dùng được public."], ["Đa hình với List&lt;Bird&gt;", "public class Bird { public virtual void Fly() { Console.WriteLine(\"Fly\"); } }\npublic class Eagle : Bird { public override void Fly() { Console.WriteLine(\"Eagle Fly\"); } }\npublic class Duck  : Bird { public override void Fly() { Console.WriteLine(\"Duck Fly\"); } }\nList<Bird> birds = new List<Bird> { new Eagle(), new Duck() };\nforeach (Bird b in birds) b.Fly();       // Eagle Fly rồi Duck Fly", "Cùng một lời gọi <code>b.Fly()</code> nhưng mỗi đối tượng chạy phiên bản của mình."], ["Lớp abstract Phong (rút gọn từ bài tính tiền phòng)", "abstract class Phong {\n    public string MaSoPhong { get; set; }\n    public int SoDien { get; set; }\n    public Phong(string maSo, int soDien) { MaSoPhong = maSo; SoDien = soDien; }\n    public abstract double TinhTienPhong();\n    public virtual void Xuat() { Console.WriteLine(\"Phong {0}\", MaSoPhong); }\n}\nclass PhongA : Phong {\n    public int SoNguoiThan { get; set; }\n    public PhongA(string maSo, int soDien, int soNguoiThan) : base(maSo, soDien) {\n        SoNguoiThan = soNguoiThan;\n    }\n    public override double TinhTienPhong() { return 1400 + 2 * SoDien + 50 * SoNguoiThan; }\n    public override void Xuat() { base.Xuat(); Console.WriteLine(\"Tien: \" + TinhTienPhong()); }\n}", "Bản rút gọn (bỏ số nước): lớp cha có constructor, phương thức abstract bắt buộc override và phương thức virtual để con mở rộng bằng <code>base.Xuat()</code>."], ["Lớp lồng nhau LopHoc.SinhVien", "public class LopHoc {\n    private string tenlop = \"TH1\";\n    internal class SinhVien {\n        private string tensv = \"Nguyen Van An\";\n        public void HienThi(LopHoc lop) {\n            Console.WriteLine(tensv + \" - \" + lop.tenlop);   // đọc được private của lớp ngoài\n        }\n    }\n}\nLopHoc lop = new LopHoc();\nLopHoc.SinhVien sv = new LopHoc.SinhVien();\nsv.HienThi(lop);", "Dùng qua tên lớp ngoài: <code>LopHoc.SinhVien</code>; lớp trong truy cập thành viên private của lớp ngoài thông qua một đối tượng LopHoc."], ["sealed và sealed override", "sealed class Animal { }\n// class Dog : Animal { }                       // lỗi: không kế thừa được lớp sealed\n\nclass Cho { public virtual void Run() { } }\nclass ChoCon : Cho { public sealed override void Run() { } }\n// class Puppy : ChoCon { public override void Run() { } }   // lỗi: Run đã bị sealed", "<code>sealed</code> trên lớp chặn kế thừa; <code>sealed override</code> trên phương thức chặn các lớp sau override tiếp."]], "cards": [["protected nghĩa là gì?", "Lớp con truy cập được; bên ngoài thì không."], ["Thứ tự gọi constructor khi tạo lớp con?", "Constructor lớp cha trước, rồi lớp con."], ["new và override khác nhau?", "new che phương thức cha (theo kiểu biến); override ghi đè (theo đối tượng thật, cần virtual ở cha)."], ["Phương thức abstract là gì?", "Chỉ khai báo, không có thân; lớp con không abstract bắt buộc override."], ["sealed dùng làm gì?", "Ngăn kế thừa lớp, hoặc ngăn override tiếp (sealed override)."], ["Interface khác abstract class?", "Interface chỉ khai báo và implement được nhiều cái; abstract class có thể có phần cài đặt nhưng chỉ kế thừa một."], ["base dùng để làm gì?", "Gọi constructor hoặc phương thức của lớp cha: : base(x), base.Xuat()."], ["Biến kiểu cha trỏ tới đối tượng con được không?", "Được (Xe h = new XeHoi()), nhưng chỉ gọi được thành viên khai báo ở lớp cha."], ["Mọi lớp trong C# kế thừa từ đâu?", "Từ lớp object."], ["Lớp abstract có constructor không?", "Có; lớp con gọi bằng : base(...), nhưng không new trực tiếp lớp abstract được."], ["Thành viên interface mặc định là gì?", "public."], ["Lớp lồng nhau dùng thế nào?", "LopHoc.SinhVien; lớp trong truy cập được thành viên private của lớp ngoài qua một đối tượng."], ["sealed override để làm gì?", "Cho con ghi đè một lần rồi chặn các lớp sau ghi đè tiếp."]], "quiz": [["Tạo <code>new LopCon(8, 6)</code> (LopCon : LopCha), constructor nào chạy trước?", null, ["Constructor lớp cha", "Constructor lớp con", "Chạy song song", "Tùy trình biên dịch"], 0, "Cha trước, con sau."], ["Kết quả của dòng cuối?", "class Xe { public void Xuat() { Console.Write(\"Xe\"); } }\nclass XeHoi : Xe { public new void Xuat() { Console.Write(\"XeHoi\"); } }\nXe h = new XeHoi();\nh.Xuat();", ["XeHoi", "Xe", "XeXeHoi", "Lỗi biên dịch"], 1, "new chỉ che; gọi qua biến kiểu Xe nên chạy Xuat của Xe."], ["Đổi thành <code>virtual</code> ở Xe và <code>override</code> ở XeHoi thì <code>h.Xuat()</code> in ra?", null, ["Xe", "XeHoi", "Cả hai", "Lỗi"], 1, "virtual/override cho đa hình: chạy theo đối tượng thật là XeHoi."], ["Dòng nào lỗi biên dịch?", "abstract class Tau { public abstract void LayThongTin(); }\nTau t = new Tau();", ["Dòng 1", "Dòng 2: không new được lớp trừu tượng", "Không dòng nào", "Cả hai dòng"], 1, "Lớp trừu tượng chỉ để kế thừa; dùng làm kiểu biến thì được: Tau t = new TauChien();"], ["Có <code>sealed public class Animal</code>; viết thêm <code>class Dog : Animal</code>. Kết quả?", null, ["Biên dịch được", "Lỗi: không thể kế thừa lớp sealed", "Chỉ cảnh báo", "Dog thành sealed"], 1, "sealed ngăn kế thừa."], ["Câu nào đúng trong C#?", null, ["Lớp kế thừa nhiều lớp cha", "Lớp implement được nhiều interface", "Interface có constructor", "Có thể new interface"], 1, "Đơn kế thừa lớp nhưng implement nhiều interface (Tinhtoans : ITinhtoan, IKetqua)."], ["LopCha chỉ có <code>LopCha(int x)</code>. LopCon có <code>LopCon(int x, int y)</code> nhưng không ghi <code>: base(x)</code>. Kết quả?", null, ["Chạy bình thường", "Lỗi biên dịch: cha không có constructor mặc định", "x = 0", "Lỗi lúc chạy"], 1, "Không ghi base thì C# tự gọi constructor không tham số của cha, mà nó không tồn tại."], ["<code>Rectangle r = new Square();</code> (Square override cả SetHeight và SetWidth để gán cả hai cạnh). Sau <code>r.SetHeight(10); r.SetWidth(5);</code> diện tích là?", null, ["50", "25", "15", "0"], 1, "Cả hai cạnh cùng thành 5 nên 25 thay vì 50: dấu hiệu vi phạm LSP."], ["<code>Xe h = new XeHoi();</code> (XeHoi : Xe). Điều nào đúng?", null, ["Lỗi biên dịch vì khác kiểu", "Hợp lệ; h chỉ gọi được thành viên khai báo ở Xe", "Hợp lệ; h gọi được mọi thành viên của XeHoi", "Hợp lệ nhưng phải ép kiểu"], 1, "Biến kiểu cha trỏ được tới đối tượng con nhưng chỉ gọi được phần đã khai báo ở lớp cha."], ["Lớp cha gốc của mọi lớp trong C# là?", null, ["Base", "object", "System", "Class"], 1, "Mọi lớp ngầm kế thừa System.Object (object)."], ["Đoạn code nào gây lỗi biên dịch?", "abstract class Phong {\n    public abstract double TinhTienPhong();\n}\nclass PhongA : Phong { }", ["Không lỗi", "Lỗi: PhongA chưa override TinhTienPhong", "Lỗi: abstract không có thân", "Chỉ cảnh báo"], 1, "Lớp con không abstract phải cài đặt mọi phương thức abstract của cha."], ["Lớp abstract <code>Phong</code> chỉ có constructor <code>Phong(string maSo)</code>. <code>PhongA</code> phải làm gì?", null, ["Không cần làm gì", "Gọi <code>: base(maSo)</code> trong constructor của PhongA", "Khai báo lại Phong", "Đổi Phong thành sealed"], 1, "Cha chỉ có constructor có tham số nên con bắt buộc : base(...)."], ["Kết quả in ra?", "class Bird { public virtual void Fly() { Console.WriteLine(\"Fly\"); } }\nclass Duck : Bird { public override void Fly() { Console.WriteLine(\"Duck Fly\"); } }\nList<Bird> ds = new List<Bird> { new Bird(), new Duck() };\nforeach (Bird b in ds) b.Fly();", ["Fly, Fly", "Fly, Duck Fly", "Duck Fly, Duck Fly", "Lỗi biên dịch"], 1, "Mỗi phần tử chạy Fly theo đối tượng thật: Bird in Fly, Duck in Duck Fly."], ["Lớp lồng <code>LopHoc.SinhVien</code> có đọc được <code>tenlop</code> (private của LopHoc) không?", null, ["Không, private chỉ dùng trong chính nó", "Có, thông qua một đối tượng LopHoc", "Chỉ khi tenlop là static", "Chỉ khi SinhVien kế thừa LopHoc"], 1, "Lớp lồng nằm trong lớp ngoài nên truy cập được thành viên private của lớp ngoài qua đối tượng (HienThi(LopHoc lop))."], ["Phương thức abstract chỉ được khai báo trong?", null, ["Mọi lớp", "Lớp abstract", "Lớp sealed", "Lớp static"], 1, "Lớp chứa phương thức abstract bắt buộc phải khai báo abstract."], ["Có <code>class Cho { public virtual void Run() {} }</code> và <code>class ChoCon : Cho { public sealed override void Run() {} }</code>. Lớp <code>Puppy : ChoCon</code> override Run thì?", null, ["Biên dịch được", "Lỗi: Run đã bị sealed", "Chỉ cảnh báo", "Run thành abstract"], 1, "sealed override chặn mọi lớp sau override tiếp."], ["Thứ tự in ra khi <code>new C()</code>?", "class A { public A() { Console.Write(\"A \"); } }\nclass B : A { public B() { Console.Write(\"B \"); } }\nclass C : B { public C() { Console.Write(\"C \"); } }\nnew C();", ["C B A", "A B C", "C", "A C"], 1, "Constructor chạy từ lớp gốc xuống lớp con: A, B rồi C."]]};const $=s=>document.querySelector(s);
const KW='abstract|override|virtual|sealed|class|interface|public|private|protected|static|new|void|int|string|double|float|decimal|bool|char|return|if|else|for|foreach|while|do|in|this|base|get|set|value|enum|ref|try|catch|throw|namespace|using';
const RX=new RegExp(String.raw`(//.*|/\*[\s\S]*?\*/)|("(?:[^"\\\n]|\\.)*")|\b(${KW})\b|\b(\d+(?:\.\d+)?f?)\b`,'g');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(RX,(m,c,t,k,n)=>c?`<i class=c>${c}</i>`:t?`<i class=s>${t}</i>`:k?`<i class=k>${k}</i>`:`<i class=n>${n}</i>`);
$('#t0').innerHTML=D.theory.map(([h,b])=>`<div class=card><h3>${h}</h3>${b}</div>`).join('')+`<div class=trap><b>Bẫy thường gặp khi thi</b><ul>${D.traps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
$('#t1').innerHTML=D.code.map(([h,c,n])=>`<div class=card><h3>${h}</h3><pre><code>${hl(c.trim())}</code></pre><p>${n}</p></div>`).join('');
$('#t2').innerHTML='<p class=sub>Bấm vào thẻ để xem đáp án, bấm lần nữa để quay lại câu hỏi.</p><div class=fcs>'+D.cards.map(([q],i)=>`<button class=fc aria-pressed=false data-i=${i}>${esc(q)}</button>`).join('')+'</div>';
$('#t2').onclick=e=>{const b=e.target.closest('.fc');if(!b)return;const [q,a]=D.cards[b.dataset.i];const on=b.classList.toggle('on');b.textContent=on?a:q;b.setAttribute('aria-pressed',on)};
let order,score,done;const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function quiz(){order=sh(D.quiz.map((_,i)=>i));score=done=0;
$('#t3').innerHTML=order.map((qi,n)=>{const [q,code,os]=D.quiz[qi];return `<div class=q data-n=${n}><p><b>Câu ${n+1}.</b> ${q}</p>${code?`<pre><code>${hl(code)}</code></pre>`:''}${sh(os.map((_,j)=>j)).map(j=>`<button class=o data-j=${j}>${os[j]}</button>`).join('')}<p class=ex hidden></p></div>`}).join('')+'<div id=res><span id=sc>Chọn đáp án để bắt đầu</span><button class=o id=rs style="width:auto;margin:0">Làm lại</button></div>'}
$('#t3').onclick=e=>{const b=e.target.closest('.o');if(!b)return;if(b.id=='rs')return quiz();const q=b.closest('.q');if(!q||q.dataset.d)return;q.dataset.d=1;const [,,,ok,ex]=D.quiz[order[q.dataset.n]],j=+b.dataset.j;
q.querySelector('.o[data-j="'+ok+'"]').classList.add('ok');if(j==ok)score++;else b.classList.add('no');const p=q.querySelector('.ex');p.hidden=false;p.textContent=ex;done++;
$('#sc').textContent=`Đúng ${score}/${done} (tổng ${D.quiz.length} câu)`;
if(done==D.quiz.length){try{const k='oop'+D.n;if(score>(+localStorage.getItem(k)||0))localStorage.setItem(k,score)}catch(_){}$('#sc').textContent=`Hoàn thành: ${score}/${D.quiz.length} câu đúng`}};
quiz();
document.querySelectorAll('nav.t button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav.t button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on');scrollTo(0,0)});</script><script>(function(){var b=document.getElementById("thm"),h=document.documentElement;function r(){var d=h.dataset.theme=="dark";b.setAttribute("aria-pressed",d);b.textContent=d?"☀️ Sáng":"🌙 Tối"}b.onclick=function(){h.dataset.theme=h.dataset.theme=="dark"?"light":"dark";try{localStorage.setItem("oop-theme",h.dataset.theme)}catch(e){}r()};r()})()</script></body></html>
