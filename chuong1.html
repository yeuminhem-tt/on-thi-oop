<!doctype html><html lang=vi><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Chương 0–1: Nền tảng C# và lớp đầu tiên – Ôn thi OOP</title><style>:root{--ac:#2f7dd1}*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#1d2440;font:16px/1.65 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}

code{background:#fff0a6;padding:1px 6px;border-radius:5px;font:14px Consolas,"Cascadia Code",monospace}
pre{background:#1b2037;color:#e6e9f8;border-radius:12px;padding:14px 16px;overflow:auto;font:14px/1.55 Consolas,"Cascadia Code",monospace;margin:8px 0}

.pn{display:flex;justify-content:space-between;margin-top:30px}
.ch{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #dfe4f1;border-left:8px solid var(--ac);border-radius:12px;padding:14px 18px;margin:14px 0}
.ch:hover{background:#fbfcff}.ch h2{margin:0 0 4px;font-size:21px;color:var(--ac)}.ch p{margin:2px 0;color:#5b6486}.ch b{color:#1d2440}</style></head><body><div class=wrap><a href=index.html>← Trang chủ</a><h1>Chương 0–1: Nền tảng C# và lớp đầu tiên</h1><p class=sub>Cú pháp C# dùng xuyên suốt môn học, rồi viết lớp và đối tượng đầu tiên (Phân số).</p>
<nav class=t><button class=on data-t=t0>Lý thuyết</button><button data-t=t1>Code mẫu</button><button data-t=t2>Flashcard</button><button data-t=t3>Trắc nghiệm</button></nav>
<section id=t0 class=on></section><section id=t1></section><section id=t2></section><section id=t3></section>
<p class=pn><span></span><span><a href=chuong2.html>Chương 2 →</a></span></p></div><script>const D={"n": 1, "theory": [["Rẽ nhánh và vòng lặp", "<ul><li><code>if/else</code>, toán tử ba ngôi <code>đk ? a : b</code>. Năm nhuận: <code>(n%4==0 &amp;&amp; n%100!=0) || n%400==0</code></li><li><code>switch</code>: mỗi case phải có <code>break</code> (C# không cho chạy rơi xuống case sau); <code>default</code> bắt các giá trị còn lại</li><li><code>for</code> khi biết số lần, <code>while</code> kiểm tra trước, <code>do..while</code> chạy ít nhất 1 lần, <code>foreach</code> duyệt mảng/chuỗi/List</li><li><code>break</code> thoát vòng lặp, <code>continue</code> bỏ qua lượt hiện tại, <code>goto</code> nhảy tới nhãn (ít dùng)</li></ul>"], ["Mảng và tập hợp", "<ul><li>1 chiều: <code>int[] a = new int[n]</code>, <code>a.Length</code>. 2 chiều: <code>int[,]</code>, <code>GetLength(0)</code> là số dòng, <code>GetLength(1)</code> là số cột</li><li>Mảng nhọn <code>int[][]</code>: mỗi dòng dài khác nhau, truy cập <code>a[i][j]</code></li><li>Sao chép mảng: <code>CopyTo</code>, <code>Array.Copy</code>, <code>Clone()</code></li><li><code>List&lt;T&gt;</code>: Add, Remove, Clear, Count. <code>ArrayList</code> chứa object, cần <code>using System.Collections</code>, có Sort/Reverse</li><li><code>r.Next(min, max)</code>: giá trị max không bao giờ xuất hiện</li></ul>"], ["Ký tự, chuỗi, enum", "<ul><li><code>char</code>: Char.IsDigit/IsLetter/IsUpper/ToUpper...; <code>(char)65</code> là 'A'</li><li><code>string</code>: Equals, IndexOf, Insert, Remove(start,count), Replace, Substring(start,len), Split, string.Join, PadLeft</li><li><code>enum</code>: bắt đầu từ 0, tăng dần; gán lại giá trị thì đếm tiếp từ đó (Third = 20 thì Fourth = 21); đổi sang số bằng <code>(int)</code></li></ul>"], ["Lớp và đối tượng (Chương 1)", "<ul><li>Lớp là khuôn gồm thuộc tính và phương thức; đối tượng tạo bằng <code>new</code>: <code>Phanso p1 = new Phanso();</code></li><li><code>this</code> trỏ đối tượng hiện tại. Phân số: nhập, in, cộng rồi rút gọn bằng UCLN (thuật toán Euclid)</li></ul>"], ["Cấu trúc chương trình và nhập xuất", "<ul><li>Khung chương trình: <code>namespace</code> → <code>class Program</code> → <code>static void Main(string[] args)</code></li><li><code>Console.Write</code> không xuống dòng, <code>WriteLine</code> có xuống dòng. <code>ReadLine()</code> luôn trả về <code>string</code> nên phải đổi kiểu: <code>int.Parse</code>, <code>double.Parse</code>, <code>Convert.ToInt32</code></li><li>Định dạng: <code>{0:0.00}</code> hiển thị 2 chữ số thập phân; hiển thị tiếng Việt cần <code>Console.OutputEncoding = Encoding.UTF8</code></li><li><code>Console.ReadKey()</code> giữ màn hình đến khi bấm phím bất kỳ</li></ul>"], ["Phương thức trong lớp", "<ul><li>Phương thức <code>private</code> chỉ dùng nội bộ (<code>tinhGiaiThua</code>), phương thức <code>public</code> là cổng cho bên ngoài gọi (<code>Xuat</code>)</li><li>Phương thức trả về giá trị bằng <code>return</code> hoặc là <code>void</code>; tham số truyền vào để xử lý, ví dụ <code>ucln(a, b)</code></li><li>Lớp HinhTron: field <code>bankinh</code>; Chuvi = 2πr, Dientich = πr²</li></ul>"]], "traps": ["Duyệt mảng: chỉ số cuối là <code>Length-1</code>, dùng <code>&lt;=</code> sẽ lỗi vượt biên.", "Chia số nguyên: <code>5/2 = 2</code>. Muốn 2.5 phải dùng <code>5/2.0</code> (như <code>-b/(2.0*a)</code> khi giải PT bậc hai).", "<code>Convert.ToChar(\"aa\")</code> báo lỗi vì chuỗi dài hơn 1 ký tự.", "Khai báo <code>Phanso p;</code> mà chưa <code>new</code> thì chưa dùng được thuộc tính.", "Hàm xử lý chuỗi không đổi chuỗi gốc: <code>s.Replace(...)</code> phải gán lại <code>s = s.Replace(...)</code>.", "<code>ReadLine()</code> trả về string: quên <code>int.Parse</code> khi gán vào biến int sẽ báo lỗi."], "code": [["Lớp Phân số: nhập, cộng, rút gọn", "class Phanso {\n    public int tuso, mauso;\n    public void NhapPhanso() {\n        Console.Write(\"Tu so = \");\n        this.tuso = int.Parse(Console.ReadLine());\n        do { this.mauso = int.Parse(Console.ReadLine()); }\n        while (this.mauso == 0);              // mẫu số phải khác 0\n    }\n    public Phanso congphanso(Phanso ph1, Phanso ph2) {\n        Phanso ph3 = new Phanso();\n        ph3.tuso  = ph1.tuso * ph2.mauso + ph2.tuso * ph1.mauso;\n        ph3.mauso = ph1.mauso * ph2.mauso;\n        int uc = ucln(ph3.tuso, ph3.mauso);    // rút gọn\n        ph3.tuso /= uc; ph3.mauso /= uc;\n        return ph3;\n    }\n    public int ucln(int a, int b) {\n        int r = 1;\n        while (r != 0) { r = a % b; a = b; b = r; }\n        return a;\n    }\n}", "<code>do..while</code> ép nhập lại đến khi mẫu số khác 0. Hàm ucln chạy vòng lặp chia lấy dư cho đến khi dư bằng 0."], ["Mảng nhọn (jagged)", "int[][] arr = { new int[] {1, 2, 3}, new int[] {3, 4, 5, 6, 7, 8, 9} };\nfor (int i = 0; i < arr.Length; i++) {\n    for (int j = 0; j < arr[i].Length; j++)   // mỗi dòng dài khác nhau\n        Console.Write(\"\\t\" + arr[i][j]);\n    Console.WriteLine();\n}", "Vòng ngoài duyệt số dòng, vòng trong dùng <code>arr[i].Length</code> vì độ dài mỗi dòng khác nhau."], ["Giải phương trình bậc hai (if / else if / else)", "double d = b * b - 4 * a * c;\nif (d == 0) {\n    x1 = -b / (2.0 * a);                       // nghiệm kép\n} else if (d > 0) {\n    x1 = (-b + Math.Sqrt(d)) / (2 * a);\n    x2 = (-b - Math.Sqrt(d)) / (2 * a);\n} else\n    Console.Write(\"Vo nghiem\");", "Dùng <code>2.0</code> để chia số thực; chỉ gọi Math.Sqrt khi delta không âm."], ["switch, do..while và foreach", "switch (a) {\n    case 1: Console.WriteLine(\"Ban chon Case 1\"); break;\n    case 2: Console.WriteLine(\"Ban chon Case 2\"); break;\n    default: Console.WriteLine(\"Khong dung gia tri\"); break;\n}\nint gt = 1, i = 1;\ndo { gt *= i; i++; } while (i <= 5);          // 5! = 120\nforeach (char c in \"dai hoc\") Console.Write(char.ToUpper(c));", "Mỗi case kết thúc bằng <code>break</code>. Vòng do..while tính 5! = 120; foreach duyệt từng ký tự của chuỗi."], ["List và ArrayList", "List<string> ds = new List<string>();\nds.Add(\"An\"); ds.Add(\"Binh\"); ds.Add(\"happy\");\nds.Remove(\"An\");                              // xóa phần tử\nforeach (string s in ds) Console.WriteLine(s);\nArrayList al = new ArrayList();               // using System.Collections;\nal.Add(45); al.Add(78); al.Add(33);\nal.Sort(); al.Reverse();                      // tăng dần rồi đảo thành giảm dần", "<code>List&lt;T&gt;</code> chỉ chứa một kiểu; <code>ArrayList</code> chứa object nên trộn được nhiều kiểu."], ["Lớp HinhTron: field private, phương thức public", "class HinhTron {\n    double bankinh;                             // mặc định private\n    public void Nhap() { bankinh = double.Parse(Console.ReadLine()); }\n    public double Chuvi()    { return bankinh * 2 * Math.PI; }\n    public double Dientich() { return Math.Pow(bankinh, 2) * Math.PI; }\n}\nHinhTron ht = new HinhTron(); ht.Nhap();\nConsole.WriteLine(\"{0:0.00}\", ht.Dientich());", "Bên ngoài không đọc được <code>bankinh</code>, chỉ gọi các phương thức public."]], "cards": [["do..while khác while ở đâu?", "do..while chạy thân vòng lặp ít nhất 1 lần rồi mới kiểm tra điều kiện."], ["GetLength(0) và GetLength(1)?", "Số dòng và số cột của mảng 2 chiều."], ["List<T> hơn mảng ở điểm nào?", "Kích thước thay đổi được; có sẵn Add, Remove, Clear, Count."], ["Mảng nhọn là gì?", "Mảng của các mảng, mỗi mảng con dài khác nhau; truy cập a[i][j]."], ["Enum: First, Second, Third=20, Fourth?", "0, 1, 20, 21 (đếm tiếp từ giá trị gán gần nhất)."], ["new làm gì với lớp?", "Cấp phát bộ nhớ và gọi constructor để tạo đối tượng."], ["Các cách sao chép mảng?", "CopyTo, Array.Copy, Clone() (nhớ ép kiểu)."], ["ReadLine() trả về kiểu gì?", "Luôn là string; phải đổi kiểu bằng int.Parse, double.Parse hoặc Convert.To..."], ["{0:0.00} nghĩa là gì?", "Chỗ giữ vị trí tham số số 0 trong chuỗi, hiển thị với 2 chữ số thập phân."], ["break khác continue?", "break thoát hẳn vòng lặp; continue bỏ phần còn lại của lượt hiện tại và sang lượt kế."], ["Chuỗi có đổi được tại chỗ không?", "Không; Replace, Insert, Remove trả về chuỗi mới nên phải gán lại."], ["Công thức UCLN theo Euclid?", "Lặp r = a % b; a = b; b = r đến khi r = 0, UCLN là a."], ["Phương thức private khác public?", "private chỉ dùng trong lớp; public cho bên ngoài gọi qua đối tượng."]], "quiz": [["Trong C#, <code>switch</code> có case chứa lệnh nhưng quên <code>break</code> thì sao?", null, ["Chạy tiếp sang case kế như C/C++", "Báo lỗi biên dịch", "Tự thêm break", "Bỏ qua case đó"], 1, "C# không cho chạy rơi xuống case sau, nên thiếu break là lỗi biên dịch."], ["Với <code>int[,] a = new int[3,4];</code>, <code>a.GetLength(1)</code> bằng?", null, ["3", "4", "12", "2"], 1, "Chiều 0 là số dòng (3), chiều 1 là số cột (4)."], ["In ra giá trị nào?", "string s2 = \"Hello everybody!\";\nint i = s2.IndexOf(\"e\");\ni = s2.IndexOf(\"e\", i + 1);\nConsole.WriteLine(i);", ["1", "6", "8", "-1"], 1, "Lần đầu e ở vị trí 1; tìm tiếp từ vị trí 2 thì gặp e ở vị trí 6."], ["Cấu trúc nào đổi kích thước linh hoạt và có Add/Remove?", null, ["int[]", "List&lt;string&gt;", "int[,]", "char"], 1, "List<T> tự quản lý số phần tử; mảng có kích thước cố định."], ["Với <code>enum V { First, Second, Third = 20, Fourth }</code>, <code>(int)V.Fourth</code> là?", null, ["3", "21", "20", "4"], 1, "Sau Third = 20 các giá trị tăng dần nên Fourth = 21."], ["Đoạn code sau cho kết quả gì?", "Phanso p1;\np1.tuso = 3;", ["Chạy bình thường", "Lỗi: dùng biến chưa gán (chưa new)", "Lỗi: tuso là private", "Chỉ cảnh báo"], 1, "Phải có p1 = new Phanso(); trước khi dùng thành viên."], ["Đoạn code in ra gì?", "int i = 0;\nwhile (true) {\n    Console.WriteLine(i);\n    i++;\n    if (i < 10) break;\n    else continue;\n}", ["Các số 0 đến 9", "Chỉ số 0", "Lặp vô hạn", "Không in gì"], 1, "In 0, tăng i lên 1, vì 1 < 10 nên break ngay."], ["Giá trị của <code>5 / 2</code> và <code>5 / 2.0</code> lần lượt là?", null, ["2 và 2", "2 và 2.5", "2.5 và 2.5", "3 và 2.5"], 1, "Chia hai số nguyên cho kết quả nguyên; chỉ cần một vế là số thực thì ra 2.5."], ["Phương trình có a = 1, b = -3, c = 2. Các nghiệm là?", null, ["x1 = 2, x2 = 1", "x1 = 1, x2 = 1", "x1 = -2, x2 = -1", "Vô nghiệm"], 0, "Delta = 9 - 8 = 1 &gt; 0; x1 = (3+1)/2 = 2, x2 = (3-1)/2 = 1."], ["Kết quả in ra?", "string s = \"Hello\";\ns.Replace(\"ll\", \"r\");\nConsole.WriteLine(s);", ["Hero", "Hello", "Hell", "Lỗi biên dịch"], 1, "string không đổi tại chỗ; Replace trả về chuỗi mới nên phải viết s = s.Replace(...)."], ["<code>\"Hello\".Substring(1, 3)</code> trả về?", null, ["Hel", "ell", "ello", "Hell"], 1, "Substring(vị trí bắt đầu, số ký tự): từ chỉ số 1 lấy 3 ký tự là ell."], ["Với <code>int[][] a = { new int[]{1,2,3}, new int[]{3,4,5,6,7,8,9} };</code> thì <code>a[1][2]</code> là?", null, ["3", "4", "5", "6"], 2, "Dòng 1 là {3,4,5,6,...}; chỉ số 2 là phần tử thứ ba, giá trị 5."], ["<code>ucln(12, 18)</code> theo thuật toán Euclid trong bài Phân số trả về?", null, ["3", "6", "12", "18"], 1, "12 % 18 = 12; 18 % 12 = 6; 12 % 6 = 0 nên UCLN là 6."], ["<code>Console.ReadLine()</code> trả về kiểu dữ liệu nào?", null, ["int", "string", "char", "Tùy dữ liệu người dùng nhập"], 1, "Luôn là string; muốn tính toán phải đổi kiểu bằng int.Parse, double.Parse..."], ["Đoạn code in ra giá trị nào?", "int gt = 1, i = 1;\ndo { gt *= i; i++; } while (i <= 5);\nConsole.WriteLine(gt);", ["24", "120", "720", "5"], 1, "Tích 1·2·3·4·5 = 120."]]};const $=s=>document.querySelector(s);
const KW='abstract|override|virtual|sealed|class|interface|public|private|protected|static|new|void|int|string|double|float|decimal|bool|char|return|if|else|for|foreach|while|do|in|this|base|get|set|value|enum|ref|try|catch|throw|namespace|using';
const RX=new RegExp(String.raw`(//.*)|("(?:[^"\\\n]|\\.)*")|\b(${KW})\b|\b(\d+(?:\.\d+)?)\b`,'g');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(RX,(m,c,t,k,n)=>c?`<i class=c>${c}</i>`:t?`<i class=s>${t}</i>`:k?`<i class=k>${k}</i>`:`<i class=n>${n}</i>`);
$('#t0').innerHTML=D.theory.map(([h,b])=>`<div class=card><h3>${h}</h3>${b}</div>`).join('')+`<div class=trap><b>Bẫy thường gặp khi thi</b><ul>${D.traps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
$('#t1').innerHTML=D.code.map(([h,c,n])=>`<div class=card><h3>${h}</h3><pre><code>${hl(c.trim())}</code></pre><p>${n}</p></div>`).join('');
$('#t2').innerHTML='<p class=sub>Bấm vào thẻ để xem đáp án, bấm lần nữa để quay lại câu hỏi.</p><div class=fcs>'+D.cards.map(([q],i)=>`<button class=fc data-i=${i}>${esc(q)}</button>`).join('')+'</div>';
$('#t2').onclick=e=>{const b=e.target.closest('.fc');if(!b)return;const [q,a]=D.cards[b.dataset.i];const on=b.classList.toggle('on');b.textContent=on?a:q};
let order,score,done;
function quiz(){order=D.quiz.map((_,i)=>i).sort(()=>Math.random()-.5);score=done=0;
$('#t3').innerHTML=order.map((qi,n)=>{const [q,code,os]=D.quiz[qi];return `<div class=q data-n=${n}><p><b>Câu ${n+1}.</b> ${q}</p>${code?`<pre><code>${hl(code)}</code></pre>`:''}${os.map((o,j)=>`<button class=o data-j=${j}>${o}</button>`).join('')}<p class=ex hidden></p></div>`}).join('')+'<div id=res><span id=sc>Chọn đáp án để bắt đầu</span><button class=o id=rs style="width:auto;margin:0;color:#1d2440">Làm lại</button></div>'}
$('#t3').onclick=e=>{const b=e.target.closest('.o');if(!b)return;if(b.id=='rs')return quiz();const q=b.closest('.q');if(!q||q.dataset.d)return;q.dataset.d=1;const [,,,ok,ex]=D.quiz[order[q.dataset.n]],j=+b.dataset.j;
